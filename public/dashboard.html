<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <div class="header">
    <h2>⚡ Tip Dashboard</h2>
    <div>
      <a href="index.html">View Leaderboard</a> |
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </div>
  <p id="userInfo"></p>

  <!-- Tip Submission Form -->
  <div class="card">
    <h3>Submit Tip / Adjust Points</h3>
    <form id="tipForm">
      <label for="personSelect">Select Person/People (Hold Ctrl/Cmd to select multiple):</label>
      <select id="personSelect" multiple required></select>

      <label for="pointsInput">Points to Add or Remove (e.g. 10 or -5):</label>
      <input type="number" id="pointsInput" placeholder="Points" required />

      <label for="reasonInput">Reason:</label>
      <input type="text" id="reasonInput" placeholder="e.g. Great presentation" />

      <label for="descInput">Description:</label>
      <textarea id="descInput" placeholder="Additional details..."></textarea>

      <button type="submit">Submit Points</button>
    </form>
    <p id="statusMsg"></p>
  </div>

  <!-- Superuser: Website & Tip Logs -->
  <div class="card superuser-only">
    <h3>📜 Tip Logs & Undo</h3>
    <div class="logs-scroll-container" id="logsScrollContainer">
      <table id="logsTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Logged By</th>
            <th>Recipient(s)</th>
            <th>Points</th>
            <th>Reason</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Superuser: Add/Remove People -->
  <div class="card superuser-only">
    <h3>👥 Manage People</h3>
    <form id="addPersonForm">
      <input type="text" id="newPersonName" placeholder="New Person Name" required />
      <button type="submit">Add Person</button>
    </form>
    <ul id="peopleList"></ul>
  </div>

  <!-- Superuser: Account Management -->
  <div class="card superuser-only">
    <h3>🔐 Manage Accounts</h3>
    <form id="createUserForm">
      <input type="email" id="newUserEmail" placeholder="User Email" required />
      <input type="password" id="newUserPass" placeholder="Password" required />
      <select id="newUserRole">
        <option value="standard">Standard User</option>
        <option value="superuser">Superuser</option>
      </select>
      <button type="submit">Create Account</button>
    </form>
    <ul id="usersList"></ul>
  </div>

  <!-- JS Dependencies -->
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
