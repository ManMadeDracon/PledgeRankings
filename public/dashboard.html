<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tip Dashboard</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .card { background: #f9f9f9; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
    input, select, textarea, button { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    select[multiple] { height: 120px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
    .superuser-only { display: none; }
    .undone { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>

  <div class="header">
    <h2>⚡ Tip Dashboard</h2>
    <div>
      <a href="index.html">View Leaderboard</a> | 
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </div>
  <p id="userInfo"></p>

  <!-- Tip Submission Form -->
  <div class="card">
    <h3>Submit Tip / Adjust Points</h3>
    <form id="tipForm">
      <label>Select Person/People (Hold Ctrl/Cmd to select multiple):</label>
      <select id="personSelect" multiple required></select>

      <label>Points to Add or Remove (e.g. 10 or -5):</label>
      <input type="number" id="pointsInput" placeholder="Points" required />

      <label>Reason:</label>
      <input type="text" id="reasonInput" placeholder="e.g. Great presentation" />

      <label>Description:</label>
      <textarea id="descInput" placeholder="Additional details..."></textarea>

      <button type="submit">Submit Points</button>
    </form>
    <p id="statusMsg"></p>
  </div>

  <!-- Superuser: Website & Tip Logs -->
  <div class="card superuser-only">
    <h3>📜 Tip Logs & Undo</h3>
    <table id="logsTable">
      <thead>
        <tr>
          <th>Time</th><th>User</th><th>Points</th><th>Reason</th><th>Description</th><th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Superuser: Add/Remove People -->
  <div class="card superuser-only">
    <h3>👥 Manage People</h3>
    <form id="addPersonForm">
      <input type="text" id="newPersonName" placeholder="New Person Name" required />
      <button type="submit">Add Person</button>
    </form>
    <ul id="peopleList"></ul>
  </div>

  <!-- Superuser: Account Management -->
  <div class="card superuser-only">
    <h3>🔐 Manage Accounts</h3>
    <form id="createUserForm">
      <input type="email" id="newUserEmail" placeholder="User Email" required />
      <input type="password" id="newUserPass" placeholder="Password" required />
      <select id="newUserRole">
        <option value="standard">Standard User</option>
        <option value="superuser">Superuser</option>
      </select>
      <button type="submit">Create Account</button>
    </form>
    <ul id="usersList"></ul>
  </div>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let sessionToken = '';
    let currentUserRole = 'standard';

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }

      sessionToken = session.access_token;
      
      // Get User Profile Role
      const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
      currentUserRole = profile?.role || 'standard';

      document.getElementById('userInfo').innerText = `Logged in as: ${session.user.email} (${currentUserRole.toUpperCase()})`;

      if (currentUserRole === 'superuser') {
        document.querySelectorAll('.superuser-only').forEach(el => el.style.display = 'block');
        loadLogs();
        loadUsers();
      }

      loadPeople();
    }

    async function loadPeople() {
      const { data } = await supabaseClient.from('rankings').select('*').order('name');
      const select = document.getElementById('personSelect');
      const list = document.getElementById('peopleList');
      select.innerHTML = '';
      if (list) list.innerHTML = '';

      data?.forEach(person => {
        select.innerHTML += `<option value="${person.id}">${person.name} (${person.points} pts)</option>`;
        if (list && currentUserRole === 'superuser') {
          list.innerHTML += `<li>${person.name} <button onclick="removePerson(${person.id})">Remove</button></li>`;
        }
      });
    }

    async function loadLogs() {
      const { data } = await supabaseClient.from('tip_logs').select('*').order('created_at', { ascending: false });
      const tbody = document.querySelector('#logsTable tbody');
      tbody.innerHTML = '';

      data?.forEach(log => {
        const rowClass = log.is_undone ? 'undone' : '';
        const actionBtn = log.is_undone ? 'Undone' : `<button onclick="undoTip(${log.id})">Undo</button>`;
        tbody.innerHTML += `
          <tr class="${rowClass}">
            <td>${new Date(log.created_at).toLocaleString()}</td>
            <td>${log.user_email}</td>
            <td>${log.points_changed}</td>
            <td>${log.reason || ''}</td>
            <td>${log.description || ''}</td>
            <td>${actionBtn}</td>
          </tr>`;
      });
    }

    async function loadUsers() {
      const { data } = await supabaseClient.from('profiles').select('*');
      const list = document.getElementById('usersList');
      list.innerHTML = '';
      data?.forEach(u => {
        list.innerHTML += `<li>${u.email} [${u.role}] <button onclick="deleteUser('${u.id}')">Delete</button></li>`;
      });
    }

    // Submit Tip Form
    document.getElementById('tipForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const personIds = Array.from(document.getElementById('personSelect').selectedOptions).map(o => o.value);
      const points = document.getElementById('pointsInput').value;
      const reason = document.getElementById('reasonInput').value;
      const description = document.getElementById('descInput').value;

      const res = await fetch('/api/submit-tip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify({ personIds, points, reason, description })
      });

      const result = await res.json();
      if (res.ok) {
        document.getElementById('statusMsg').style.color = 'green';
        document.getElementById('statusMsg').innerText = 'Points updated successfully!';
        loadPeople();
        if (currentUserRole === 'superuser') loadLogs();
      } else {
        document.getElementById('statusMsg').style.color = 'red';
        document.getElementById('statusMsg').innerText = result.error;
      }
    });

    // Superuser Actions
    async function undoTip(logId) {
      await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify({ action: 'undo_tip', payload: { logId } })
      });
      loadLogs();
      loadPeople();
    }

    async function removePerson(personId) {
      await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify({ action: 'remove_person', payload: { personId } })
      });
      loadPeople();
    }

    document.getElementById('addPersonForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('newPersonName').value;
      await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify({ action: 'add_person', payload: { name } })
      });
      document.getElementById('newPersonName').value = '';
      loadPeople();
    });

    document.getElementById('createUserForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('newUserEmail').value;
      const password = document.getElementById('newUserPass').value;
      const role = document.getElementById('newUserRole').value;

      await fetch('/api/manage-users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify({ action: 'create_user', email, password, role })
      });
      loadUsers();
    });

    async function deleteUser(userId) {
      await fetch('/api/manage-users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
        body: JSON.stringify({ action: 'delete_user', userId })
      });
      loadUsers();
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });

    init();
  </script>
</body>
</html>
