<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Registration</title>
  <style>
    body { font-family: sans-serif; max-width: 350px; margin: 80px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>📝 Create Account</h2>
  <form id="registerForm">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <input type="password" id="registrationKey" placeholder="Secret Key" required />
    <button type="submit">Register</button>
  </form>
  <p id="msg"></p>

  <script>
    // Auto-fill secret key if provided in URL parameter (e.g., register.html?key=YOUR_ADMIN_PASSWORD)
    const urlParams = new URLSearchParams(window.location.search);
    const keyFromUrl = urlParams.get('key');
    if (keyFromUrl) {
      document.getElementById('registrationKey').value = keyFromUrl;
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.innerText = 'Creating account...';
      msg.className = '';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const registrationKey = document.getElementById('registrationKey').value;

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, registrationKey })
      });

      const result = await res.json();

      if (res.ok) {
        msg.className = 'success';
        msg.innerText = 'Account created! Redirecting to login...';
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        msg.className = 'error';
        msg.innerText = result.error || 'Failed to create account.';
      }
    });
  </script>
</body>
</html>
