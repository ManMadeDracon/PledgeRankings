<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Rankings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .leaderboard { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    .person { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .admin-panel { margin-top: 30px; background: #f9f9f9; padding: 15px; border-radius: 8px; }
    input, select, button { display: block; margin: 10px 0; padding: 8px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>

  <h1>🏆 Live Leaderboard</h1>
  <div id="leaderboard" class="leaderboard">Loading...</div>

  <div class="admin-panel">
    <h3>🔒 Admin Tip/Points Panel</h3>
    <form id="tipForm">
      <label>Select Person:</label>
      <select id="personSelect" required></select>

      <label>Points to Add:</label>
      <input type="number" id="pointsInput" placeholder="e.g. 5" required />

      <label>Admin Password:</label>
      <input type="password" id="passwordInput" placeholder="Enter secret password" required />

      <button type="submit">Submit Points</button>
    </form>
    <p id="statusMsg"></p>
  </div>

  <script>
    // Replace with your values
    const SUPABASE_URL = "https://knctohwxfytzjuonrmqx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuY3RvaHd4Znl0emp1b25ybXF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTE2MzQsImV4cCI6MjEwNDM4NzYzNH0.-kOQXzSkdK7lEmOF5QPJ6kbINeGDzB9Jw4XNkexM_CM";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fetch and display rankings
    async function loadRankings() {
      const { data, error } = await supabase
        .from('rankings')
        .select('*')
        .order('points', { ascending: false });

      if (error) return console.error(error);

      const listDiv = document.getElementById('leaderboard');
      const select = document.getElementById('personSelect');
      listDiv.innerHTML = '';
      select.innerHTML = '';

      data.forEach(item => {
        // Build Leaderboard UI
        listDiv.innerHTML += `
          <div class="person">
            <span><strong>${item.name}</strong></span>
            <span>${item.points} pts</span>
          </div>`;

        // Populate Select Dropdown
        select.innerHTML += `<option value="${item.id}">${item.name}</option>`;
      });
    }

    // Subscribe to Realtime Database Updates
    supabase
      .channel('realtime-rankings')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rankings' }, () => {
        loadRankings(); // Automatically refresh when scores change
      })
      .subscribe();

    // Handle Form Submission
    document.getElementById('tipForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('statusMsg');
      status.innerText = "Submitting...";

      const personId = document.getElementById('personSelect').value;
      const points = document.getElementById('pointsInput').value;
      const adminPassword = document.getElementById('passwordInput').value;

      const res = await fetch('/api/update-points', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ personId, points, adminPassword })
      });

      const result = await res.json();
      if (res.ok) {
        status.style.color = "green";
        status.innerText = "Points added successfully!";
        document.getElementById('pointsInput').value = '';
      } else {
        status.style.color = "red";
        status.innerText = result.error || "Failed to update";
      }
    });

    // Initial Load
    loadRankings();
  </script>
</body>
</html>
