<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Rankings & Activity Feed</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="container">
    <!-- Left Column: Leaderboard -->
    <div class="left-col">
      <h1>🏆 Live Leaderboard</h1>
      <div id="leaderboard" class="leaderboard">Loading rankings...</div>
    </div>

    <!-- Right Column: Recent Activity Feed -->
    <div class="right-col">
      <h2>📢 Recent Activity</h2>
      <div id="feed" class="feed-list">Loading feed...</div>
    </div>
  </div>

  <a href="login.html" id="authBtn" class="corner-btn">🔒 Dashboard Login</a>

  <!-- JS Dependencies -->
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
