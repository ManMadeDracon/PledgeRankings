<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Rankings</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .leaderboard { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    .person { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    
    /* Corner Admin Link Icon */
    .admin-icon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: white;
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 50%;
      font-size: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .admin-icon:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <h1>🏆 Live Leaderboard</h1>
  <div id="leaderboard" class="leaderboard">Loading...</div>

  <!-- Corner Lock Icon -->
  <a href="admin.html" class="admin-icon" title="Admin Panel">🔒</a>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadRankings() {
      const { data, error } = await supabaseClient
        .from('rankings')
        .select('*')
        .order('points', { ascending: false });

      if (error) return console.error(error);

      const listDiv = document.getElementById('leaderboard');
      listDiv.innerHTML = '';

      data.forEach(item => {
        listDiv.innerHTML += `
          <div class="person">
            <span><strong>${item.name}</strong></span>
            <span>${item.points} pts</span>
          </div>`;
      });
    }

    // Realtime Database Updates
    supabaseClient
      .channel('realtime-rankings')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rankings' }, () => {
        loadRankings();
      })
      .subscribe();

    loadRankings();
  </script>
</body>
</html>
