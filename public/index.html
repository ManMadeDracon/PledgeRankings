<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Rankings</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .leaderboard { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    .person { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .corner-btn { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 16px; border-radius: 30px; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🏆 Live Leaderboard</h1>
  <div id="leaderboard" class="leaderboard">Loading...</div>
  <a href="login.html" id="authBtn" class="corner-btn">🔒 Dashboard Login</a>

  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('authBtn').innerText = '⚡ Go to Dashboard';
        document.getElementById('authBtn').href = 'dashboard.html';
      }
    }

    async function loadRankings() {
      const { data } = await supabaseClient.from('rankings').select('*').order('points', { ascending: false });
      const listDiv = document.getElementById('leaderboard');
      listDiv.innerHTML = '';
      data?.forEach(item => {
        listDiv.innerHTML += `<div class="person"><span><strong>${item.name}</strong></span><span>${item.points} pts</span></div>`;
      });
    }

    supabaseClient.channel('realtime-rankings')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rankings' }, loadRankings)
      .subscribe();

    checkAuth();
    loadRankings();
  </script>
</body>
</html>
